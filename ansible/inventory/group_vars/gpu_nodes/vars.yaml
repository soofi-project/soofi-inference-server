# ── STT Service (speaches / faster-whisper) ──────────────────────────────────
stt_service:
  container_name: "faster-whisper"
  image: "ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda-12.6.3"
  internal_port: 8010
  container_port: 8000
  litellm_name: "whisper-1"
  litellm_model: "openai/whisper-1"
  healthcheck_path: "/health"
  gpu_devices: ["0"]
  volumes:
    - "{{ deploy_dir }}/models/hf_cache:/home/ubuntu/.cache/huggingface"
  environment:
    - "PRELOAD_MODELS=[\"Systran/faster-whisper-large-v3\"]"
    - "WHISPER__INFERENCE_DEVICE=cuda"
    - "WHISPER__COMPUTE_TYPE=float16"
    - "STT_MODEL_TTL=-1"

# ── Falcon-Perception (FastAPI vision server, own /v1/predictions API) ───────
# Not OpenAI-compatible — NOT registered in LiteLLM and no litellm depends_on;
# reached directly via the host port, like the reranker. Image is built on the
# GPU host (see custom_images). First start compiles the model (torch.compile +
# CUDA graphs) which can take ~15 min — hence the healthcheck overrides; the
# /cache volume persists compile artifacts so restarts are fast. Comment out
# the whole block to disable. GPU 0: reranker uses 0.15, cosmos 0.5 when
# enabled — check nvidia-smi headroom before enabling alongside more models.
falcon_perception_service:
  container_name: "falcon-perception"
  image: "soofi/falcon-perception:v1.0.0-lowmem1"
  hf_name: "tiiuae/Falcon-Perception"
  internal_port: 8004
  container_port: 7860
  healthcheck_path: "/v1/health"
  healthcheck_start_period: "900s"
  healthcheck_retries: 40
  shm_size: "16gb"
  gpu_devices: ["1"]
  volumes:
    - "{{ deploy_dir }}/models/hf_cache:/models/huggingface"          # image sets HF_HOME here
    - "{{ deploy_dir }}/models/falcon_perception_cache:/cache"        # torchinductor/triton compile caches
  environment:
    - "HF_MODEL_ID=tiiuae/Falcon-Perception"
    - "DTYPE=bfloat16"
    - "NUM_GPUS=1"
    - "N_PAGES=128"
    - "MAX_BATCH_SIZE=8"
    - "MAX_SEQ_LENGTH=4096"
    - "PREFILL_LENGTH_LIMIT=4096"
    # Keeps the pinned CPU HR segmentation feature pool around ~4 GiB at 1024px.
    - "MAX_HR_CACHE_ENTRIES=8"
    - "HF_TOKEN={{ hf_token }}"
    - "TEMPERATURE=0.0"

# ── Docling GPU Service (PDF→Markdown, Vision Transformer on GPU) ──────────
# Runs docling-layout-heron + tableformer-v2 on GPU 1 (~1-2 GB VRAM).
# Used for benchmarking PDF conversion latency (CPU vs GPU).
# Not registered in LiteLLM — accessed directly via port 8020.
docling_service:
  enabled: false
  container_name: "docling-gpu"
  build_context: "{{ deploy_dir }}/docling-service"
  internal_port: 8020
  container_port: 8000
  healthcheck_path: "/health"
  gpu_devices: ["0"]
  environment:
    - "DOCLING_DEVICE=cuda"
    - "PDF_TABLE_STRUCTURE=true"

# Image versions
litellm_image: "ghcr.io/berriai/litellm:v1.83.14-stable.patch.2"
webui_image: "ghcr.io/open-webui/open-webui:v0.8.10"

# Ports
litellm_port: 4000
webui_port: 3000

# Open WebUI
webui_auth: "false"
webui_name: "AI Inference Server"

