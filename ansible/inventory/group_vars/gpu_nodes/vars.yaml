# Deployment variables for gpu_nodes
# Secrets (hf_token, litellm_master_key) are in vault.yaml — encrypt before committing:
#   ansible-vault encrypt ansible/inventory/group_vars/gpu_nodes/vault.yaml
# Parser reference (tool_call_parser / reasoning_parser choices): see PARSERS.md

# NVIDIA stack versions
nvidia_driver_version: "590"
nvidia_driver_branch: "server-open"   # open kernel modules (optimized for H200 GSP)
cuda_version: "12-4"                  # apt format (dash-separated)

deploy_dir: /opt/soofi

# vLLM defaults — override per model if needed.
vllm_defaults:
  repository: "vllm/vllm-openai"
  tag: "v0.21.0"
  config:
    tensor_parallel_size: 1
    dtype: "auto"
    enable_prefix_caching: true
    enable_chunked_prefill: true

# Custom images — built on the GPU host by stack_deploy.yaml before the stack
# starts, but only when an enabled model (via repository/tag) or a service
# block (via image) references them. Dockerfiles live in docker/ at the repo root.
custom_images:
  - repository: "soofi/vllm-openai-cosmos3"
    tag: "v0.21.0"
    dockerfile: "Dockerfile.vllm-cosmos3"
  # Falcon-Perception FastAPI server — based on upstream REPO_REF pinned in the
  # Dockerfile, with a local low-memory server patch. Bump the tag when changing
  # the patch or upstream ref so Compose recreates the container.
  - repository: "soofi/falcon-perception"
    tag: "v1.0.0-lowmem1"
    dockerfile: "Dockerfile.falcon-perception"

# Shared parser/tooling presets for model families.
parser_profiles:
  qwen3:
    enable_auto_tool_choice: true
    tool_call_parser: "qwen3_xml"
    reasoning_parser: "qwen3"

  qwen3_coder:
    enable_auto_tool_choice: true
    tool_call_parser: "qwen3_coder"
    reasoning_parser: "qwen3"

  nemotron_v3:
    enable_auto_tool_choice: true
    tool_call_parser: "qwen3_coder"

  soofi:
    # Soofi-S-* are NVIDIA Nemotron-3-Nano fine-tunes (Soofi_Nano_V3_30B_A3B).
    # tool_call_parser qwen3_coder is correct for Nemotron-3. The reasoning parser
    # MUST be the custom nano_v3 (DeepSeekR1 subclass): plain deepseek_r1 assumes an
    # implicit opening <think> and, with enable_thinking:false (no closing </think>),
    # swallows the ENTIRE output — incl. tool calls — into reasoning_content, leaving
    # content/tool_calls empty. nano_v3 swaps them back when thinking is off.
    # Plugin file is mounted per model (extraVolumes → /opt/parsers/...). See PARSERS.md.
    enable_auto_tool_choice: true
    tool_call_parser: "qwen3_coder"
    reasoning_parser: "nano_v3"

  minimax_m2:
    enable_auto_tool_choice: true
    tool_call_parser: "minimax_m2"
    reasoning_parser: "minimax_m2_append_think"

# Models to deploy — each gets its own vllm/vllm-openai container.
# Set enabled: false to keep a model in the catalog without deploying it.
# repository/tag are optional — fall back to vllm_defaults above.
# Use parser_profile for tool/reasoning settings; keep extra_args for one-offs.
